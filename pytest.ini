[pytest]
testpaths = backend/tests backend/mcp/tests cli/tests extensions
addopts = -p no:cacheprovider
markers =
    gpu: needs a CUDA device (skipped in CI)
    slow: long-running; excluded from the CI smoke job
    integration: touches live services (Redis, Postgres, Ollama, ComfyUI)
filterwarnings =
    ignore::DeprecationWarning:basicsr.*

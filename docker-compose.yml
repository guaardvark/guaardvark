###############################################################################
# Guaardvark — Self-Hosted AI Workstation
# ./start-docker.sh — that's it. On first start it writes GUAARDVARK_API_KEY
# to .env next to this file and prints it; enter it once in Settings → API key
# in each browser.
# GPU: ./start-docker.sh --gpu  (or: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up)
###############################################################################

services:
  # PostgreSQL, Redis and Ollama are published on this host's loopback only.
  # The backend reaches them over the compose network (postgres:5432,
  # redis:6379, ollama:11434); the published ports are for tools on this host
  # (psql, redis-cli, ollama). ./start-docker.sh gives a new install its own
  # random GUAARDVARK_POSTGRES_PASSWORD and GUAARDVARK_REDIS_PASSWORD in the
  # .env next to this file; without them both fall back to the stock
  # "guaardvark". Ollama has no login. GUAARDVARK_POSTGRES_PUBLISH_HOST,
  # GUAARDVARK_REDIS_PUBLISH_HOST and GUAARDVARK_OLLAMA_PUBLISH_HOST in that
  # .env (e.g. 0.0.0.0) publish one on other interfaces deliberately; see
  # INSTALL.md.

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guaardvark
      # Read only when the image creates the database (an empty pgdata volume).
      POSTGRES_PASSWORD: ${GUAARDVARK_POSTGRES_PASSWORD:-guaardvark}
      POSTGRES_DB: guaardvark
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${GUAARDVARK_POSTGRES_PUBLISH_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guaardvark"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${GUAARDVARK_REDIS_PASSWORD:-guaardvark}
    # Redis keeps nothing on disk here, so it takes whatever password .env
    # holds at each start.
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "${GUAARDVARK_REDIS_PUBLISH_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (Local LLM) ────────────────────────────────────────────────
  ollama:
    restart: unless-stopped
    image: ollama/ollama:latest
    ports:
      - "${GUAARDVARK_OLLAMA_PUBLISH_HOST:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # ── Backend (Flask + Celery) ───────────────────────────────────────────
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        # Set by start-docker.sh --gpu from the host GPU; see Dockerfile.backend.
        TORCH_CHANNEL: ${GUAARDVARK_TORCH_CHANNEL:-}
    environment:
      GUAARDVARK_ROOT: /app
      DATABASE_URL: postgresql://guaardvark:${GUAARDVARK_POSTGRES_PASSWORD:-guaardvark}@postgres:5432/guaardvark
      REDIS_URL: redis://:${GUAARDVARK_REDIS_PASSWORD:-guaardvark}@redis:6379/0
      CELERY_BROKER_URL: redis://:${GUAARDVARK_REDIS_PASSWORD:-guaardvark}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${GUAARDVARK_REDIS_PASSWORD:-guaardvark}@redis:6379/0
      # backend/config.py reads OLLAMA_BASE_URL; the ollama Python client reads OLLAMA_HOST.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
      FLASK_PORT: "5000"
      # The UI reaches the backend through the frontend container, so even a
      # browser on this host counts as another device: protected actions
      # (running tools, automation, backups, ...) need this key. Compose reads
      # it from .env next to this file; ./start-docker.sh creates it.
      GUAARDVARK_API_KEY: ${GUAARDVARK_API_KEY:-}
      # Tells Settings → API key that the key is managed in that .env.
      GUAARDVARK_DOCKER: "1"
      # Browser origins besides http://localhost:5173, comma-separated, e.g.
      # http://192.168.1.20:5173 to open the UI from another device. The
      # container cannot see this host's addresses. The backend answers only
      # to IP addresses, localhost and the names listed here or below, so a
      # name such as http://myhost:5173 must be listed to open the UI by it.
      GUAARDVARK_CORS_ORIGINS: ${GUAARDVARK_CORS_ORIGINS:-}
      # The name other containers on this network call the backend by
      # (http://backend:5000).
      VITE_ALLOWED_HOSTS: backend
      # The quiet-library settings start.sh exports: no library telemetry, no
      # pip version checks.
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      ORT_DISABLE_TELEMETRY: "1"
      UNSLOTH_DISABLE_STATISTICS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Optional — set your Anthropic key for Uncle Claude:
      # ANTHROPIC_API_KEY: sk-ant-...
    ports:
      - "5000:5000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      # The credential store (backend/utils/credential_store.py): Connections
      # and WordPress site keys and the key that encrypts them. A volume of its
      # own, so they outlive a rebuilt or recreated container.
      - app_config:/root/.config/guaardvark
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    # The API plus the two Celery workers start_celery.sh runs natively, with the
    # same queues. An autoresearch run's worker (queue research) is started in
    # this container on demand by backend/services/research_worker.py.
    command: >
      sh -c "
        cd /app &&
        { flask db upgrade || echo 'flask db upgrade failed; the backend starts anyway' >&2; };
        python -m flask run --host 0.0.0.0 --port 5000 &
        CELERY_WORKER_MODE=true celery -A backend.celery_app.celery worker --hostname=main@%h --queues=health,default,indexing,generation,training_gpu --concurrency=1 --max-memory-per-child=4096000 --loglevel=info &
        CELERY_WORKER_MODE=true celery -A backend.celery_app.celery worker --hostname=training@%h --queues=training --concurrency=1 --max-memory-per-child=4096000 --loglevel=info &
        wait
      "

  # ── Frontend (React/Vite via nginx) ────────────────────────────────────
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  ollama_models:
  app_data:
  app_logs:
  app_config:

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # librosa 1.x requires numpy>=2.1; the backend pins numpy<2.0 (see
      # backend/requirements.txt), so the resolver falls back to building an
      # old scipy from source and fails. Lift this with the numpy 2 migration.
      - dependency-name: librosa
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint 10 fails eslint-plugin-react 7.33's peer requirement
      # ("^3 || ... || ^8 || ^9.7"), so the lint stack has to move together —
      # plugin bumps plus the flat-config migration (PR #210 closed 2026-09-19).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

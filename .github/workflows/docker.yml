# Build the two Docker images from this repository and publish them to Docker Hub.
#
#   guaardvark/guaardvark       the backend (API, Celery, plugins), PyTorch on CUDA
#   guaardvark/guaardvark-web   the web UI
#
# Images are built here, from the public source at the tagged commit, and nowhere
# else: a build on a developer machine can carry local files the repository
# never saw.
#
# Trigger: the same version tag that publishes the CLI, e.g.
#   git tag v$(cat VERSION) && git push origin v$(cat VERSION)
# which publishes X.Y.Z, X.Y and latest.
#
# Or run it from the Actions tab: that builds the chosen branch and publishes it
# under the tag given (default "edge"), and never moves "latest".
name: Docker images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish this build under"
        type: string
        default: edge

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  # The CUDA build of PyTorch baked into the backend image: cu132 (PyTorch
  # 2.14.1) covers GTX 16 and RTX 20 through RTX 50 cards on an NVIDIA driver
  # 580 or newer. start-docker.sh --pull builds locally for anything else.
  TORCH_CHANNEL: cu132

jobs:
  publish:
    name: Build and publish
    # Pinned: the backend image needs the disk freed below, and a new runner
    # image changes what is there to remove.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Refuse a tag that disagrees with VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          file_version="$(cat VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$file_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($file_version)."
            exit 1
          fi

      - name: Refuse a manual tag that looks like a release
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          case "$MANUAL_TAG" in
            latest|[0-9]*|v[0-9]*)
              echo "::error::\"$MANUAL_TAG\" is published only by a version tag push."
              exit 1 ;;
            *[!A-Za-z0-9_.-]*|"")
              echo "::error::Image tags use letters, digits, dot, dash and underscore."
              exit 1 ;;
          esac

      # The backend image is larger than the space a fresh runner has free.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags for the backend image
        id: backend
        uses: docker/metadata-action@v6
        with:
          images: guaardvark/guaardvark
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Tags for the web image
        id: web
        uses: docker/metadata-action@v6
        with:
          images: guaardvark/guaardvark-web
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          provenance: true
          sbom: true

      - name: Build and push the backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.backend
          build-args: |
            TORCH_CHANNEL=${{ env.TORCH_CHANNEL }}
          push: true
          tags: ${{ steps.backend.outputs.tags }}
          labels: ${{ steps.backend.outputs.labels }}
          provenance: true
          sbom: true

      - name: Disk after the build
        if: always()
        run: df -h / | tail -1

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  cli:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CLI package
        run: pip install -e ./cli pytest

      - name: Run CLI test suite
        run: python -m pytest cli/tests -q

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Quality gate (static)
        run: |
          source backend/venv/bin/activate
          python scripts/quality_gate.py --mode static

      - name: No machine-specific paths
        run: bash scripts/check_portable.sh

      - name: Check Python syntax
        run: |
          source backend/venv/bin/activate
          python -m py_compile backend/app.py
          python -m py_compile backend/config.py
          python -m py_compile backend/models.py
          python -c "
          import pathlib, py_compile, sys
          errors = []
          for f in pathlib.Path('backend/api').glob('*.py'):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          for f in pathlib.Path('backend/services').glob('*.py'):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All Python files compile successfully')
          "

  macos:
    name: macOS (Apple Silicon) install + platform smoke
    runs-on: macos-latest
    timeout-minutes: 40

    # Every macOS bug in #41 was a Linux-workstation assumption that leaked
    # into shared code: a Debian font path, a hardcoded service port, a
    # function called before it was defined, an X11-only script recommended
    # to Mac users. None needed a GPU to find. This job installs on a fresh
    # Mac the way a user would and imports the modules those bugs lived in.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (as a user would)
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pytest pytest-timeout

      - name: Compile everything
        run: |
          source backend/venv/bin/activate
          python -m compileall -q backend/api backend/services backend/utils backend/tools backend/tasks scripts

      - name: Import the modules Mac users exercise
        run: |
          source backend/venv/bin/activate
          python - <<'EOF'
          import importlib, sys
          modules = [
              "backend.utils.platform",
              "backend.utils.comfyui_url",
              "backend.services.video_text_overlay",
              "backend.services.infographic_generator",
              "backend.services.video_generation_router",
              "backend.services.offline_video_generator",
              "backend.tools.agent_control_tools",
              "backend.utils.agent_display_utils",
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  failed.append(f"{m}: {type(e).__name__}: {e}")
          if failed:
              print("\n".join(failed)); sys.exit(1)
          print(f"{len(modules)} modules import on macOS")
          EOF

      - name: Platform tests
        run: |
          source backend/venv/bin/activate
          python -m pytest --timeout=600 -q \
            backend/tests/unit/test_platform_fallbacks.py \
            backend/tests/unit/test_platform.py \
            backend/tests/unit/test_ollama_lifecycle_sh.py \
            backend/tests/unit/test_env_values.py \
            backend/tests/test_media_import_no_cuda.py

      - name: start.sh parses and the preflight runs
        run: |
          bash -n start.sh
          source backend/venv/bin/activate
          python scripts/preflight_check.py || true

  macos-boot:
    name: macOS (Apple Silicon) boot
    runs-on: macos-latest
    timeout-minutes: 90

    # The job above proves the backend imports on a Mac; this one proves the app
    # comes up. It runs ./start.sh on a fresh runner exactly as a Mac user would
    # (Homebrew Postgres + pgvector, Redis, the frontend build, backend, Celery),
    # then calls the endpoints a first page load depends on and stops cleanly.
    # The runner has no usable Metal GPU (PyTorch reports MPS available, then
    # fails on the first allocation), so generation is out of scope here.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Ollama is a separate install on a Mac (start.sh only installs it through
      # apt). Homebrew is the common way; the models start.sh pulls are small.
      - name: Install Ollama
        run: brew install ollama

      - name: ./start.sh
        env:
          # start.sh exits at once under CI unless a job asks for the boot.
          GUAARDVARK_CI_BOOT: "1"
        run: |
          set -o pipefail
          ./start.sh --no-browser 2>&1 | tee start.out

      # The runner has working DNS (every install above went through it), so this
      # line appearing means the resolver probe is wrong on macOS again.
      - name: No false DNS alarm
        run: "! grep -F 'DNS resolution is broken' start.out"

      - name: Backend, database, Redis and Celery answer
        run: |
          set -a; [ -f .env ] && . ./.env; set +a
          base="http://127.0.0.1:${FLASK_PORT:-5055}"
          fail=0
          check() {  # $1 = path, $2 = pattern the body must match; retried for 2 min
            for i in $(seq 1 24); do
              body=$(curl -sS --max-time 20 "$base$1" 2>&1) && printf '%s' "$body" | grep -Eq "$2" \
                && { echo "ok   $1"; return; }
              sleep 5
            done
            echo "FAIL $1: $(printf '%s' "$body" | head -c 400)"; fail=1
          }
          check /api/health '"status": ?"ok"'
          check /api/health/db '"status": ?"ok"'
          check /api/health/redis '"status": ?"up"'
          check /api/health/celery '"status": ?"(up|busy)"'
          check /api/plugins/ '^[[{]'
          exit $fail

      - name: Frontend serves the app
        run: |
          set -a; [ -f .env ] && . ./.env; set +a
          curl -sS --max-time 20 "http://127.0.0.1:${VITE_PORT:-5173}/" | grep -qi '<div id="root"' \
            && echo "ok   frontend on ${VITE_PORT:-5173}" \
            || { echo "FAIL frontend"; exit 1; }

      - name: Ollama answers with the pulled models
        run: curl -sS --max-time 10 http://127.0.0.1:11434/api/tags

      # One message through the route the Chat page uses. The reply streams over
      # Socket.IO and is saved to the session, so the saved reply is what is read.
      # This proves a model answer comes back through the backend on a Mac, not
      # its quality: the runner can only hold llama3.2:1b on CPU, stock rules are
      # off (no persona), and a factual question sends it off to tools. The check
      # rejects the system text a broken prompt produced before (a failed
      # agent-screen query repeated back as the answer).
      - name: Chat answers a message
        run: |
          set -a; [ -f .env ] && . ./.env; set +a
          base="http://127.0.0.1:${FLASK_PORT:-5055}"
          sid="ci-macos-$(date +%s)"
          curl -sS --max-time 30 -X POST "$base/api/chat/unified" \
            -H 'Content-Type: application/json' \
            -d "{\"session_id\": \"$sid\", \"message\": \"Hi, what is your name?\"}"
          echo
          for i in $(seq 1 96); do
            reply=$(curl -sS --max-time 10 "$base/api/chat/unified/$sid/history" | python3 -c '
          import json, sys
          msgs = json.load(sys.stdin).get("messages") or []
          print(next((m["content"] for m in msgs if m.get("role") == "assistant" and (m.get("content") or "").strip()), ""))
          ' 2>/dev/null)
            if [ -n "$reply" ]; then
              if [ "${#reply}" -ge 5 ] && ! printf '%s' "$reply" | grep -Eqi 'desktop state|query failed|traceback'; then
                echo "ok   chat replied after $((i * 5))s: $(printf '%s' "$reply" | head -c 300)"
                exit 0
              fi
              echo "FAIL chat: the saved reply is not an answer to the message: $(printf '%s' "$reply" | head -c 500)"
              exit 1
            fi
            sleep 5
          done
          echo "FAIL chat: no saved reply after 480s"
          tail -n 60 logs/backend_startup.log 2>/dev/null || ls logs
          exit 1

      - name: ./stop.sh
        if: always()
        run: ./stop.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-boot-logs
          path: logs/
          if-no-files-found: warn

  backend-tests:
    name: Backend Tests (CPU smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pytest pytest-timeout

      # CPU-only suites that must stay green: security guards, the GPU
      # resource layer (gate, lease, orchestrator, admission), video/image
      # admission and unload paths, registries, plugin state, progress.
      - name: Run smoke suites
        run: |
          source backend/venv/bin/activate
          python -m pytest --timeout=900 -q \
            backend/tests/test_profiles.py \
            backend/tests/test_extensions_loader.py \
            extensions/_template/tests \
            backend/tests/api/test_batch_image_path_safety.py \
            backend/tests/api/test_chat_export_api.py \
            backend/tests/test_audit_batch2_security.py \
            backend/tests/services/test_connections_safety.py \
            backend/tests/services/test_resource_hardening.py \
            backend/tests/services/test_gpu_resource_policy.py \
            backend/tests/services/test_gpu_pipeline_pin.py \
            backend/tests/services/test_gpu_hard_fit.py \
            backend/tests/services/test_gpu_load_gates.py \
            backend/tests/services/test_gpu_session_wraps_generation.py \
            backend/tests/services/test_video_vram_wait.py \
            backend/tests/api/test_batch_video_lifecycle.py \
            backend/tests/services/test_offline_image_unload_hooks.py \
            backend/tests/services/test_offline_image_oom_ladder.py \
            backend/tests/services/test_offline_image_vae_tiling.py \
            backend/tests/services/test_image_resolution_limits.py \
            backend/tests/services/test_image_prompt_sanitize.py \
            backend/tests/services/test_media_model_registry.py \
            backend/tests/services/test_model_availability.py \
            backend/tests/services/test_video_dimension_limits.py \
            backend/tests/services/test_video_model_preflight.py \
            backend/tests/services/test_music_video_service.py \
            backend/tests/services/test_music_video_director.py \
            backend/tests/unit/test_plugin_state_store.py \
            backend/tests/unit/test_plugin_core_exemption.py \
            backend/tests/unit/test_plugin_local_overrides.py \
            backend/tests/integration/test_plugins_system.py \
            backend/tests/unit/test_unified_progress_system.py \
            backend/tests/test_interconnector_exclude.py

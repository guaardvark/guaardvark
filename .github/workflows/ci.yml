name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CLI package
        run: pip install -e ./cli pytest

      - name: Run CLI test suite
        run: python -m pytest cli/tests -q

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Quality gate (static)
        run: |
          source backend/venv/bin/activate
          python scripts/quality_gate.py --mode static

      - name: No machine-specific paths
        run: bash scripts/check_portable.sh

      - name: Check Python syntax
        run: |
          source backend/venv/bin/activate
          python -m py_compile backend/app.py
          python -m py_compile backend/config.py
          python -m py_compile backend/models.py
          python -c "
          import pathlib, py_compile, sys
          errors = []
          for f in pathlib.Path('backend/api').glob('*.py'):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          for f in pathlib.Path('backend/services').glob('*.py'):
              try:
                  py_compile.compile(str(f), doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All Python files compile successfully')
          "

  macos:
    name: macOS (Apple Silicon) install + platform smoke
    runs-on: macos-latest
    timeout-minutes: 40

    # Every macOS bug in #41 was a Linux-workstation assumption that leaked
    # into shared code: a Debian font path, a hardcoded service port, a
    # function called before it was defined, an X11-only script recommended
    # to Mac users. None needed a GPU to find. This job installs on a fresh
    # Mac the way a user would and imports the modules those bugs lived in.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (as a user would)
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pytest pytest-timeout

      - name: Compile everything
        run: |
          source backend/venv/bin/activate
          python -m compileall -q backend/api backend/services backend/utils backend/tools backend/tasks scripts

      - name: Import the modules Mac users exercise
        run: |
          source backend/venv/bin/activate
          python - <<'EOF'
          import importlib, sys
          modules = [
              "backend.utils.platform",
              "backend.utils.comfyui_url",
              "backend.services.video_text_overlay",
              "backend.services.infographic_generator",
              "backend.services.video_generation_router",
              "backend.services.offline_video_generator",
              "backend.tools.agent_control_tools",
              "backend.utils.agent_display_utils",
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  failed.append(f"{m}: {type(e).__name__}: {e}")
          if failed:
              print("\n".join(failed)); sys.exit(1)
          print(f"{len(modules)} modules import on macOS")
          EOF

      - name: Platform tests
        run: |
          source backend/venv/bin/activate
          python -m pytest --timeout=600 -q \
            backend/tests/unit/test_platform_fallbacks.py \
            backend/tests/unit/test_platform.py \
            backend/tests/test_media_import_no_cuda.py

      - name: start.sh parses and the preflight runs
        run: |
          bash -n start.sh
          source backend/venv/bin/activate
          python scripts/preflight_check.py || true

  backend-tests:
    name: Backend Tests (CPU smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv backend/venv
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt
          pip install pytest pytest-timeout

      # CPU-only suites that must stay green: security guards, the GPU
      # resource layer (gate, lease, orchestrator, admission), video/image
      # admission and unload paths, registries, plugin state, progress.
      - name: Run smoke suites
        run: |
          source backend/venv/bin/activate
          python -m pytest --timeout=900 -q \
            backend/tests/test_profiles.py \
            backend/tests/test_extensions_loader.py \
            extensions/_template/tests \
            backend/tests/api/test_batch_image_path_safety.py \
            backend/tests/api/test_chat_export_api.py \
            backend/tests/test_audit_batch2_security.py \
            backend/tests/services/test_connections_safety.py \
            backend/tests/services/test_resource_hardening.py \
            backend/tests/services/test_gpu_resource_policy.py \
            backend/tests/services/test_gpu_pipeline_pin.py \
            backend/tests/services/test_gpu_hard_fit.py \
            backend/tests/services/test_gpu_load_gates.py \
            backend/tests/services/test_gpu_session_wraps_generation.py \
            backend/tests/services/test_video_vram_wait.py \
            backend/tests/api/test_batch_video_lifecycle.py \
            backend/tests/services/test_offline_image_unload_hooks.py \
            backend/tests/services/test_offline_image_oom_ladder.py \
            backend/tests/services/test_offline_image_vae_tiling.py \
            backend/tests/services/test_image_resolution_limits.py \
            backend/tests/services/test_image_prompt_sanitize.py \
            backend/tests/services/test_media_model_registry.py \
            backend/tests/services/test_model_availability.py \
            backend/tests/services/test_video_dimension_limits.py \
            backend/tests/services/test_video_model_preflight.py \
            backend/tests/services/test_music_video_service.py \
            backend/tests/services/test_music_video_director.py \
            backend/tests/unit/test_plugin_state_store.py \
            backend/tests/unit/test_plugin_core_exemption.py \
            backend/tests/unit/test_plugin_local_overrides.py \
            backend/tests/integration/test_plugins_system.py \
            backend/tests/unit/test_unified_progress_system.py \
            backend/tests/test_interconnector_exclude.py

capture:
  max_fps: 2.0
  min_fps: 0.25
  quality: 70
  width: 512
  format: "jpeg"

# Defaults chosen 2026-11-03 against published video benchmarks (Video-MME,
# no subtitles): qwen3.5:4b 76.9, qwen3.5:9b 78.4, the best that fit a 16 GB
# card beside ComfyUI. gemma4 publishes no video score and is the still-frame
# fallback; minicpm-v4.6 and moondream are the cheap last resorts. llava:13b,
# the previous escalation default, is not in the Ollama library we install.
# Which installed models can see is read from Ollama /api/show at runtime.
models:
  monitor: "qwen3.5:4b"
  escalation: "qwen3.5:9b"
  auto_select: true
  fallback_order:
    - "gemma4:e4b"
    - "gemma4:12b"
    - "minicpm-v4.6"
    - "moondream"

analysis:
  # Hamming distance (0..64) between perceptual hashes above which a frame
  # is re-analysed. 8 is the value the loop was tuned with.
  phash_threshold: 8
  periodic_refresh_seconds: 10
  monitor_prompt: "Describe what you see in one brief sentence."
  escalation_prompt: "Describe this image in detail including objects, text, people, actions, and anything notable."

context:
  window_seconds: 30
  max_entries: 60
  compression_interval: 15
  max_context_tokens: 500

gpu:
  utilization_pause_threshold: 90
  utilization_throttle_threshold: 75
  contention_behavior: "min_fps"

streams:
  max_concurrent: 2
  stale_timeout_seconds: 60

camera:
  device_index: 0
  reconnect_attempts: 3
  reconnect_delay_seconds: 2

benchmark:
  test_resolutions:
    - [512, 512]
    - [720, 480]
    - [1280, 720]
  frames_per_test: 5
  results_file: "benchmark_results.json"

logging:
  file: "logs/vision_pipeline.log"
  level: "INFO"
  max_size_mb: 50
  backup_count: 3

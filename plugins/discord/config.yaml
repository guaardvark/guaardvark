bot:
  token: "${DISCORD_BOT_TOKEN}"
  # Guaardvark Discord server — enables instant slash-command sync on boot
  guild_id: 1481468315187810306

api:
  base_url: "http://localhost:${FLASK_PORT:-5002}/api"
  timeout: 120
  health_check_interval: 60

security:
  admin_roles: ["Admin", "Bot Admin"]
  allowed_channels: []
  allow_dms: true
  max_prompt_length: 2000
  max_image_prompt_length: 2000

rate_limits:
  ask: 10
  imagine: 3
  generate_csv: 2
  search: 15
  enhance_prompt: 10
  claude: 5
  video: 1

voice:
  enabled: true
  silence_threshold_ms: 1500
  max_listen_duration_s: 30
  tts_voice: "ryan"
  interrupt_on_speech: true  # barge-in not implemented yet (reserved)
  min_utterance_ms: 400  # discard blips shorter than this (coughs, key clicks)

image:
  max_queue_depth: 5
  default_steps: 9
  default_size: 1024

conversation:
  max_history: 50

channel_chat:
  channel_ids: []  # Add channel IDs where the bot listens to all messages
  respond_to_mentions: true  # Respond when @mentioned in any channel or when replying to bot messages

vip:
  user_ids: []  # Discord user IDs to receive a one-time welcome DM
  greeting: |
    Welcome to Guaardvark — a self-hosted AI platform you can make your own.

    Try `/ask` to chat with Guaardvark (whatever model and plugins are running), `/imagine` to generate images, or `/status` to see what's running. `/claude` is optional if an Anthropic key is configured.

tools:
  auto_approve: false  # Discord Approve/Deny buttons; true skips them (private servers only)

outreach:
  enabled: false  # flip to true after seeding channel ids; backend kill switch is the master gate
  channels: []    # Discord channel IDs the bot watches for relevant Ollama / ComfyUI / local-AI threads
  poll_interval_seconds: 600  # how often to scan; 600 = 10 min
  max_replies_per_pass: 1     # never reply to more than one message per channel per pass
